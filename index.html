<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>NeoX Catch Game — Opening</title>
<style>
  html,body{
    margin:0;height:100%;background:#05081A;color:#fff;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans",Arial,sans-serif;
    overflow:hidden;
  }

  /* ===== Banner ===== */
  #banner {
    position: fixed;
    inset: 0;
    display: flex;             /* 改用 flex 方便排版 */
    flex-direction: column;    /* 讓 Logo/標題 同下方的標語直排 */
    justify-content: flex-start; /* 靠頂部對齊 */
    align-items: flex-start;   /* 靠左手邊對齊 */
    padding: 40px 5%;          /* 頂部留 40px，左邊留 5% 彈性邊距，等畫面睇落平衡 */
    box-sizing: border-box;
    text-align: left;          /* 文字改為靠左對齊 */
    z-index: 10;
    background: linear-gradient(rgba(5,8,26,.55),rgba(5,8,26,.90)), 
                url('https://neoxcoin.github.io/neox-game/TreasureSite%20.JPG') center/cover no-repeat;
    animation: bannerIn 1s ease forwards;
  }

  @keyframes bannerIn{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}

  .brandline {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: flex-start; /* 確保 Logo 同標題喺左邊對齊 */
    width: 100%;
  }

  .coin {
    width: clamp(32px, 7vw, 60px); 
    height: auto; 
    flex-shrink: 0; 
    filter: drop-shadow(0 0 10px rgba(255,210,90,.35)); 
    opacity: 0; 
    transform: translateY(8px) scale(.96); 
    animation: coinIn .9s ease .15s forwards; 
  }

  @keyframes coinIn{to{opacity:1;transform:translateY(0) scale(1)}}

  h1 {
    margin: 0; 
    font-size: clamp(28px, 6vw, 48px); 
    letter-spacing: .06em; 
    text-shadow: 0 0 18px #41b0ff66,0 0 40px #41b0ff33; 
    opacity: 0; 
    transform: translateY(8px); 
    animation: fadeIn .9s ease .3s forwards; 
  }

  .tag {
    max-width: min(900px, 90vw);
    margin: 12px 0 0 0;        /* 移除左右 margin auto，改為同左邊對齊，並同上面留少少位 */
    line-height: 1.7;
    font-size: clamp(15px, 3.4vw, 20px); 
    color: #c9d8ff; 
    opacity: 0;
    transform: translateY(8px); 
    animation: fadeIn 1s ease .5s forwards; 
  }

  @keyframes fadeIn{to{opacity:1;transform:none}}
  @keyframes bannerIn{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}

  .brandline {display: flex;align-items: center;gap: 12px;justify-content: center;width: 100%;}
  .coin {
    width: clamp(32px, 7vw, 60px);
    height: auto;
    flex-shrink: 0;
    filter: drop-shadow(0 0 10px rgba(255,210,90,.35));
    opacity: 0;
    transform: translateY(8px) scale(.96);
    animation: coinIn .9s ease .15s forwards;
  }
  @keyframes coinIn{to{opacity:1;transform:translateY(0) scale(1)}}

  h1 {
    margin: 0; 
    font-size: clamp(28px, 6vw, 48px);
    letter-spacing: .06em;
    text-shadow: 0 0 18px #41b0ff66,0 0 40px #41b0ff33;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeIn .9s ease .3s forwards;
  }
  .tag{
    max-width:min(900px,90vw);margin:0 auto;
    line-height:1.7;font-size:clamp(15px,3.4vw,20px);
    color:#c9d8ff;
    opacity:0;transform:translateY(8px);
    animation:fadeIn 1s ease .5s forwards;
  }
  @keyframes fadeIn{to{opacity:1;transform:none}}

  /* ===== Opener video layer ===== */
  #opener{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:11;
    background:linear-gradient(rgba(3,6,23,.60),rgba(5,10,31,.90)),
               url('https://neoxcoin.github.io/neox-game/TreasureSite%20.JPG') center/cover no-repeat;
  }
  #openerVideo{
    width:100%;height:100%;object-fit:contain;background:#000;opacity:0;
    transition:opacity .6s ease, filter .8s ease;filter:brightness(1);
  }
  #loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    gap:12px;color:#bcd4ff;
  }
  .sp{
    width:46px;height:46px;border:4px solid #ffffff24;border-top-color:#2b7cff;border-radius:50%;
    animation:spin 1.1s linear infinite;
    filter:drop-shadow(0 0 8px #2b7cff99);
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 控制鍵（Sound / Skip） */
  .vctrl {
    position: absolute;
    left: 50%;
    bottom: calc(10% + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    gap: 16px;                     /* 稍微拉開少少距離，更好撳 */
    flex-wrap: wrap;
    justify-content: center;
  }

  .vctrl button {
    background: rgba(10, 16, 46, 0.75); /* 改用深色科技藍底色，更顯光效 */
    border: 1px solid #41b0ff88;         /* 線條改成 NeoX 主題的霓虹藍 */
    color: #c9d8ff;
    font-weight: 700;
    letter-spacing: .06em;
    padding: 12px 24px;                  /* 加寬按鈕，更有大作遊戲感 */
    border-radius: 8px;                  /* 稍微銳利一點的科技感方角 */
    cursor: pointer;
    box-shadow: 0 0 12px rgba(65, 176, 255, 0.2), 0 6px 14px rgba(0,0,0,0.4); /* 霓虹微光 + 陰影 */
    backdrop-filter: blur(6px);
    transition: all .3s ease;            /* 全屬性過渡，動畫更流暢 */
    text-transform: uppercase;           /* 文字全大寫，提升遊戲 UI 質感 */
  }

  /* 當滑鼠指過去（Hover）時的充能發光效果 */
  .vctrl button:hover {
    background: rgba(65, 176, 255, 0.25);
    border-color: #41b0ff;
    color: #fff;
    transform: translateY(-2px);         /* 微微浮起 */
    box-shadow: 0 0 20px rgba(65, 176, 255, 0.6), 0 8px 18px rgba(0,0,0,0.5); /* 強烈霓虹發光 */
  }

  /* 撳落去（Active）時的反饋 */
  .vctrl button:active {
    transform: translateY(1px);
    background: rgba(65, 176, 255, 0.15);
    box-shadow: 0 0 10px rgba(65, 176, 255, 0.4);
  }

  .vctrl.fadeout {
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
  }

  /* 手機直向：保持並排，調整字體大小 */
  @media (orientation: portrait) {
    .vctrl {
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 12px;
      bottom: calc(6% + env(safe-area-inset-bottom));
  }
    .vctrl button {
      white-space: nowrap;
      font-size: clamp(13px, 3.2vw, 15px);
      padding: 10px 18px;
  }
}

  /* ===== Start layer ===== */
  #startLayer{
    position:fixed;inset:0;display:none;place-items:center;
    background:rgba(5,8,20,.85);
    z-index:13;opacity:0;transition:opacity .9s ease;
  }
  #startLayer.visible{opacity:1}

  #startBtn{
    background:#2563eb;color:#fff;font-weight:900;letter-spacing:.05em;
    padding:18px 34px;border-radius:14px;cursor:pointer;user-select:none;
    font-size:clamp(20px,6vw,36px);
    box-shadow:0 0 25px rgba(37,99,235,.6);
    border:none;
    animation:pop .9s ease forwards;
  }
  #startBtn:disabled{
    opacity:.6;cursor:default;box-shadow:none;
  }
  @keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

  /* FX（白閃 + NeoX Coin 爆光） */
  #fx{
    position:fixed;inset:0;display:none;place-items:center;pointer-events:none;z-index:12;
  }
  #fx .flash{
    position:absolute;inset:0;background:#fff;opacity:0;
  }
  #fx .pulse{
    position:absolute;left:50%;top:50%;width:130px;height:130px;
    transform:translate(-50%,-50%) scale(.3);
    background:url('https://neoxcoin.github.io/neox-game/NeoXCoin.Front.png') center/contain no-repeat;
    filter:drop-shadow(0 0 20px rgba(80,150,255,.8)) drop-shadow(0 0 40px rgba(43,124,255,.4));
    opacity:.95;
  }
  .run .flash{animation:fx-flash .52s ease-out forwards}
  .run .pulse{animation:fx-burst .9s ease-out forwards}
  @keyframes fx-flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
  @keyframes fx-burst{
    0%  {transform:translate(-50%,-50%) scale(.3);opacity:1}
    60% {transform:translate(-50%,-50%) scale(6);opacity:.45}
    100%{transform:translate(-50%,-50%) scale(8);opacity:0}
  }
</style>
</head>
<body>

<!-- Banner -->
<section id="banner">
  <div class="brandline">
    <img class="coin" src="https://neoxcoin.github.io/neox-game/NeoXCoin.Front.png" alt="NeoX Coin" />
    <h1>NeoX Catch Game</h1>
  </div>
  <p class="tag">Your adventure begins — Catch the NeoX Coins and unlock the treasure!</p>
</section>

<!-- Opener -->
<section id="opener" aria-label="Opening">
  <div id="loading">
    <div class="sp"></div>
    <span>Loading opening…</span>
  </div>
  <video id="openerVideo" playsinline webkit-playsinline muted autoplay preload="auto"></video>
  <div class="vctrl" id="openerControls" hidden>
    <button id="btnToggleSound">🔇 Sound off</button>
    <button id="btnSkip">⏭ Skip</button>
  </div>
</section>

<!-- Start -->
<section id="startLayer">
  <button id="startBtn">▶ START GAME</button>
</section>

<!-- Transition FX -->
<div id="fx">
  <div class="flash"></div>
  <div class="pulse"></div>
</div>

<!-- Short transition BGM -->
<audio id="startBGM" preload="auto"
  src="https://neoxcoin.github.io/neox-game/NeoX_OpeningTheme_Cartoon.m4a" style="display:none"></audio>

<script>
/* Elements */
const banner   = document.getElementById('banner');
const opener   = document.getElementById('opener');
const video    = document.getElementById('openerVideo');
const loading  = document.getElementById('loading');
const ctrls    = document.getElementById('openerControls');
const btnToggleSound = document.getElementById('btnToggleSound');
const btnSkip  = document.getElementById('btnSkip');
const start    = document.getElementById('startLayer');
const startBtn = document.getElementById('startBtn');
const fx       = document.getElementById('fx');
const startBGM = document.getElementById('startBGM');

/* 防止 Opening 流程重覆執行 */
let openingDone = false;

/* ---------- Banner → Opener ---------- */
setTimeout(()=>{
  banner.style.transition = 'opacity .9s ease';
  banner.style.opacity = '0';
  setTimeout(()=>{
    banner.style.display = 'none';
    startOpening();
  }, 900);
}, 1800);

/* ---------- Responsive fit ---------- */
function fitVideo(){
  const r=(video.videoWidth||16)/(video.videoHeight||9);
  const s=innerWidth/innerHeight;
  video.style.objectFit = Math.abs(r-s) < 0.18 ? 'cover' : 'contain';
}
video.addEventListener('loadedmetadata', fitVideo);
addEventListener('resize', fitVideo, {passive:true});

/* ---------- Opener flow ---------- */
let ctrlFadeTimer;
function scheduleControlsFade(ms=6000){
  clearTimeout(ctrlFadeTimer);
  ctrlFadeTimer = setTimeout(()=>ctrls.classList.add('fadeout'), ms);
}
function fadeControlsSoon(delay=600){
  clearTimeout(ctrlFadeTimer);
  setTimeout(()=>ctrls.classList.add('fadeout'), delay);
}
function showControlsAndArmTimer(ms=6000){
  ctrls.hidden = false;
  ctrls.classList.remove('fadeout');
  scheduleControlsFade(ms);
}

function startOpening(){
  opener.style.display = 'flex';
  video.src = 'https://neoxcoin.github.io/neox-game/NeoXcatchgameOpening_H264.mp4'; // 開場影片
  video.muted = true;
  video.play().then(()=>{
    loading.style.display='none';
    video.style.opacity='1';
    updateSoundLabel();
    showControlsAndArmTimer(6000);
  }).catch(()=>{
    // 自動播放失敗時仍然顯示控制鍵
    updateSoundLabel();
    showControlsAndArmTimer(6000);
  });
}

function updateSoundLabel(){
  btnToggleSound.textContent = video.muted ? '🔇 Sound off' : '🔊 Sound on';
}

btnToggleSound.addEventListener('click', async ()=>{
  try{
    if (video.paused) await video.play();
  }catch(e){}
  video.muted = !video.muted;
  updateSoundLabel();
  scheduleControlsFade(2000);
});

/* 👉 Skip 或影片播完：只會執行一次 Opening → Start Game 畫面 */
function goToStartFromOpening(){
  if (openingDone) return;       // 保證只跑一次
  openingDone = true;

  fadeControlsSoon(0);
  try{ video.pause(); }catch(e){}
  playFX();
  setTimeout(showStart, 900);
}

btnSkip.addEventListener('click', goToStartFromOpening);

video.addEventListener('playing', ()=>{
  loading.style.display='none';
  video.style.opacity='1';
  scheduleControlsFade(6000);
});

video.addEventListener('ended', goToStartFromOpening);

/* ---------- Start Layer ---------- */
function showStart(){
  opener.style.display='none';
  start.style.display='grid';
  requestAnimationFrame(()=>start.classList.add('visible'));
}

startBtn.addEventListener('click', () => {
  // 確保按一次
  if (startBtn.disabled) return;
  startBtn.disabled = true;

  try {
    startBGM.currentTime = 0;
    startBGM.volume = 1;
    startBGM.muted = false;
    startBGM.play().catch(()=>{});
  } catch(e){}

  setTimeout(() => {
    // ⚡ 如果係 iframe 裏面 → 交俾外層處理
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'NX_START_GAME' }, '*');
    } else {
      // ⚡ 如果係直接開 index.html → 自己去 v1.html
      window.location.href = 'v1.html';
    }
  }, 800);
});

/* ---------- FX ---------- */
function playFX(){
  fx.style.display='grid';
  fx.classList.remove('run');
  requestAnimationFrame(()=>fx.classList.add('run'));
  setTimeout(()=>{ fx.style.display='none'; }, 950);
}

/* 一次手勢可同時解鎖聲音（保險） */
['pointerdown','touchend','click','keydown'].forEach(evt=>{
  window.addEventListener(evt, async ()=>{
    if (video.paused){
      try{ await video.play(); }catch(e){}
    }
  }, { once:true, passive:true });
});
</script>
</body>
</html>
