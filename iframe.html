<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>NeoX Game (iframe clean)</title>

<style>
  :root { --vh: 1vh; }

  html, body {
    margin: 0;
    background: #0a0b1f;
    color: #fff;
    height: calc(var(--vh, 1vh) * 100);
    display: grid;
    place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans", Arial, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-overflow-scrolling: auto;
    touch-action: manipulation;
  }

  iframe {
    width: min(92vw, 440px);
    aspect-ratio: 9/16;
    border: 0;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
    padding: constant(safe-area-inset-top) constant(safe-area-inset-right)
             constant(safe-area-inset-bottom) constant(safe-area-inset-left);
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:#000;
  }

  /* 🏆 Top 3 Box */
  .top3 {
    position: fixed;
    top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 10px 16px;
    font-weight: 800;
    font-size: 15px;
    box-shadow: 0 6px 20px rgba(0,0,0,.3);
    backdrop-filter: blur(6px);
    display: none;
    opacity: 0;
    transition: opacity .8s ease;
    max-width: min(92vw, 440px);
  }
  .top3.show { display: block; opacity: 1; }
  .top3 ol { margin: 6px 0 0; padding-left: 20px; }
  .top3 small { opacity: .8; font-weight: 600; display:block; margin-top: 6px; }
</style>

<!-- 🎮 起始頁：整個遊戲流程 -->
<iframe id="game" src="index.html?v=3" allow="gamepad *"></iframe>

<!-- 🏆 全球排行榜 -->
<div class="top3" id="top3Box">
  <div>🏆 NeoX Top 3 Players</div>
  <ol id="top3List"><li>Loading...</li></ol>
  <small id="top3Hint"></small>
</div>

<!-- 🔧 固定可視高度（防止 iOS 地址列導致 iframe 高度跳動） -->
<script>
  (function setVh(){
    function update(){
      var h = (window.visualViewport ? visualViewport.height : window.innerHeight);
      document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
    }
    update();
    window.addEventListener('resize', update, {passive:true});
    window.addEventListener('orientationchange', update, {passive:true});
    if (window.visualViewport) {
      visualViewport.addEventListener('resize', update, {passive:true});
      visualViewport.addEventListener('scroll', update, {passive:true});
    }
  })();
</script>

<script>
/* ====== 🌐 API Config ====== */
const API_URL   = 'https://script.google.com/macros/s/AKfycbw44w4f5hpmKiledO1XfIKsGgfMgCksmcU2Qsst56l68CPLvQs4GvIg0PrItIuUqkOT2g/exec';
const GAME_ORIGIN = 'https://neoxcoin.github.io';

/* ====== 👤 Player Name ====== */
// 只用嚟記住之前填過嘅名字，不會一開始就 prompt
function getStoredName(){
  try { return localStorage.getItem('nx_player_name') || ''; }
  catch(e){ return ''; }
}
function saveName(name){
  try { localStorage.setItem('nx_player_name', name); } catch(e){}
}

/* ====== 🏆 Fetch Top 3 from Google Script ====== */
async function loadTop3(){
  const box  = document.getElementById('top3Box');
  const list = document.getElementById('top3List');
  const hint = document.getElementById('top3Hint');
  try{
    const res  = await fetch(API_URL + '?t=' + Date.now(), { cache:'no-cache' });
    const data = await res.json();
    list.innerHTML = '';
    (data||[]).slice(0,3).forEach((r,i)=>{
      const li=document.createElement('li');
      li.textContent = `${i+1}. ${r.name} — ${r.score}`;
      list.appendChild(li);
    });
    if(!list.children.length) list.innerHTML='<li>No scores yet</li>';
    hint.textContent='Updated: '+new Date().toLocaleTimeString();
    box.classList.add('show');
  }catch(e){
    list.innerHTML='<li>Network error</li>';
  }
}

/* ====== 📨 Upload score with conditional name prompt ====== */
async function submitScore(score){
  const s = Math.floor(score || 0);
  try{
    // 1️⃣ 先取最新 Top3 用來比較
    let top = [];
    try{
      const res  = await fetch(API_URL + '?t=' + Date.now(), { cache:'no-cache' });
      top = await res.json() || [];
    }catch(e){}

    // 排序由高到低
    const sorted = top.slice().sort((a,b)=>Number(b.score)-Number(a.score));
    let threshold = 0;
    if (sorted.length >= 3){
      threshold = Number(sorted[2].score || 0);   // 第三名分數
    }

    // 判斷今次係咪進入 Top3
    let isTop3 = false;
    if (sorted.length < 3) isTop3 = true;
    else if (s > threshold) isTop3 = true;

    // 2️⃣ 如今次入 Top3，先問名；否則就用現有名字或預設 Player
    let name = getStoredName();
    if (isTop3){
      const placeholder = name || '';
      const input = prompt('🎉 You reached the NeoX Top 3! Enter your player name:', placeholder) || placeholder;
      name = String(input).trim().slice(0, 20);
      if (!name) name = 'Player';
      saveName(name);
    }
    if (!name) name = 'Player';

    // 3️⃣ 上傳分數
    await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ name, score:s })
    });

  }catch(e){
    // 失敗就靜靜地 ignore
  }
}

/* ====== 🎮 Communication with iframe ====== */
const frame = document.getElementById('game');

// ⚠ 避免 iOS 多次觸發造成重播 Opening
let gameStarted = false;

window.addEventListener('message', async e => {
  if (e.origin !== GAME_ORIGIN) return;
  const m = e.data || {};

  // ▶ Opening 入面叫開始遊戲（由 index.html 發出）
  if (m.type === 'NX_START_GAME') {
    if (gameStarted) return;          // 防 double trigger
    gameStarted = true;
    frame.src = 'v1.html';
    return;
  }

  // ▶ v1 / v2 要求轉去下一關
  if (m.type === 'NX_GO_LEVEL') {
    if (m.to === 2) {
      frame.src = 'v2.html#continue';
      return;
    }
    if (m.to === 3) {
      frame.src = 'v3.html#continue';
      return;
    }
    if (m.to === 'END') {
      const qs = typeof m.score === 'number' ? ('?score=' + Math.floor(m.score)) : '';
      frame.src = 'endgame.html' + qs;
      return;
    }
  }

  // 🏁 全遊戲完成（由 endgame / v3 通知）
  if (m.type === 'NX_GAME_CLEARED') {
    const total = Math.floor(m.total || m.score || 0);
    await submitScore(total);
    await loadTop3();     // 更新頂部排行榜
  }
});

/* ====== 將已儲存名字傳入子頁（如有需要顯示） ====== */
function sendPlayerName(){
  const name = getStoredName() || 'Player';
  try{ frame.contentWindow?.postMessage({ type:'NX_PLAYER_NAME', name }, GAME_ORIGIN); }catch(e){}
}
window.addEventListener('load', () => {
  sendPlayerName();
  loadTop3();        // 一開頁就顯示現時 Top3
});
</script>
</html>
