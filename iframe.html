<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NeoX Game (iframe clean)</title>
  <style>
    :root { --vh: 1vh; }
    html, body {
      margin: 0;
      padding: 0;
      background: #0a0b1f;
      color: #fff;
      height: calc(var(--vh, 1vh) * 100);
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      
      /* 流動裝置防誤觸與優化 */
      touch-action: none; 
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    /* 1. 預設：手機網頁模式（直接用盡 100% 畫面，拿走圓角同陰影，等畫面最大化） */
    iframe {
      width: 100%;
      height: calc(var(--vh, 1vh) * 100);
      border: 0;
      background: #000;
      display: block;
      -webkit-overflow-scrolling: touch;
    }

    /* 2. 電腦 / 平板 / 大螢幕模式：當畫面夠大時，才縮小變成精緻的「手機外框」擺中間 */
    @media (min-width: 480px) and (min-height: 650px) {
      iframe {
        width: min(94vw, 460px);
        height: min(calc(var(--vh, 1vh) * 90), 820px);
        aspect-ratio: 9/16;
        border-radius: 20px;
        box-shadow: 0 12px 45px rgba(0,0,0,.5);
      }
    }

    /* 🏆 Top 3 Box */
    .top3 {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      opacity: 0;
      transition: opacity .6s ease;
      z-index: 10;
    }
    .top3.show { display: block; opacity: 1; }
    .top3 ol { margin: 6px 0 0; padding-left: 20px; }
    .top3 small { opacity: .7; font-weight: 600; font-size: 11px; }

    /* 平板/大螢幕適應：將排行榜移去側邊，唔好遮住遊戲 */
    @media (min-width: 850px) and (orientation: landscape) {
      .top3 {
        top: 30px;
        left: 30px;
        transform: none;
        width: 200px;
      }
    }
  </style>
</head>
<body>

  <iframe id="game" src="index.html?v=3" allow="gamepad *"></iframe>

  <div class="top3" id="top3Box">
    <div>🏆 NeoX Top 3 Players</div>
    <ol id="top3List"><li>Loading...</li></ol>
    <small id="top3Hint"></small>
  </div>

  <!-- 原本的 JS 邏輯保持不變 -->
  <script>
    (function setVh(){
      function update(){
        var h = (window.visualViewport ? visualViewport.height : window.innerHeight);
        document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
      }
      update();
      window.addEventListener('resize', update, {passive:true});
      window.addEventListener('orientationchange', update, {passive:true});
      if (window.visualViewport) {
        visualViewport.addEventListener('resize', update, {passive:true});
        visualViewport.addEventListener('scroll', update, {passive:true});
      }
    })();

    // ==========================================
    // ✨ 新增這段：接應 index.html 傳過來的開始遊戲訊號
    // ==========================================
    window.addEventListener('message', (event) => {
      // 檢查收唔收到訊號
      if (event.data && event.data.type === 'NX_START_GAME') {
        console.log("收到 index 的開始遊戲訊號，準備轉去 v1.html");
      
        // 獲取網頁上的 iframe 元素 (透過你在第 79 行設定的 id="game")
        const gameIframe = document.getElementById('game'); 
      
        if (gameIframe) {
          // 🔒 只改 iframe 內部嘅 src，玩家依然留在 iframe.html 控制嘅外殼裏面
          gameIframe.src = 'v1.html';
        }
      }
    });
  </script>
</body>
</html>
