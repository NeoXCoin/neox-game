<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NeoX Game (iframe clean)</title>
  <style>
    :root {
      --vh: 1vh;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #0a0b1f;
      color: #fff;
      height: calc(var(--vh, 1vh) * 100);
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      /* 流動裝置防誤觸與優化 */
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* 1. 預設：手機網頁模式（直接用盡 100% 畫面，拿走圓角同陰影，等畫面最大化） */
    iframe {
      width: 100%;
      height: calc(var(--vh, 1vh) * 100);
      border: 0;
      background: #000;
      display: block;
      -webkit-overflow-scrolling: touch;
    }

    /* 2. 電腦 / 真正的平板模式：當寬度大於 768px 且高度充足時，才縮小變成擺中間的手機外框 */
    @media (min-width: 768px) and (min-height: 650px) {
      iframe {
        width: min(94vw, 460px);
        height: min(calc(var(--vh, 1vh) * 90), 820px);
        aspect-ratio: 9/16;
        border-radius: 20px;
        box-shadow: 0 12px 45px rgba(0,0,0,.5);
      }
    }

    /* 🏆 Top 3 Box */
    .top3 {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, .08);
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <!-- 你的遊戲 iframe 內容 -->
  <iframe src="about:blank"></iframe>

  <script>
    // 處理流動端 Safari/Chrome 的 100vh 實際高度問題
    function setVh() {
      let vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    window.addEventListener('resize', setVh);
    window.addEventListener('orientationchange', setVh);
    setVh();
  </script>
</body>
</html>
