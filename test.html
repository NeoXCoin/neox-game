<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>NeoX Catch — Level 3</title>
<!-- (Keep all your existing CSS/Head logic here, I am focusing on the Script block) -->
<style>
  html,body{height:100%;margin:0;background:#070a18;color:#fff;font-family:sans-serif;overflow:hidden}
  #wrap{position:relative;height:100%;display:grid;place-items:center}
  canvas{display:block;width:min(92vw,700px);aspect-ratio:9/16;height:auto;border-radius:16px;background:transparent;box-shadow:0 22px 60px rgba(0,0,0,.45);touch-action:none;position:relative;z-index:2;}
  .hidden{display:none !important;}
  /* ... 其餘 CSS 維持不變 ... */
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="450" height="800"></canvas>
  <div id="panelWin" class="panel hidden">...</div>
</div>

<script>
/* ===== Config & Assets ===== */
const TYPES={COIN:'coin', GOLD:'gold', RUBY:'ruby', SAPP:'sapp', BOMB:'bomb'};
const BOMB_URL = "https://neoxcoin.github.io/neox-game/bomb.png";
const BOMB_DISPLAY_SIZE = 26; // 獨立設定炸彈大小為 Emoji 風格

/* ===== Images ===== */
// ... 保持原有圖片載入 ...
const bombImg = new Image(); bombImg.src = BOMB_URL; let bombReady = false; bombImg.onload = () => bombReady = true;

/* ===== Spawning Logic (修改這裡) ===== */
function spawn(dt){
  spawnTimer-=dt;
  if(spawnTimer<=0 && items.length<6){
    const r = Math.random();
    // 新增炸彈出現概率 (例如 10%)
    let type = TYPES.COIN;
    if(r < 0.10) type = TYPES.BOMB;
    else if(r < 0.50) type = TYPES.COIN;
    else if(r < 0.65) type = TYPES.GOLD;
    else if(r < 0.85) type = TYPES.RUBY;
    else type = TYPES.SAPP;

    items.push({
      type,
      x: EDGE + (Math.random() * (canvas.clientWidth - EDGE*2)),
      y: -20,
      vy: (type === TYPES.BOMB ? 4.0 : 2.5) + Math.random()*2.2, // 炸彈掉落稍快
      rot: 0, 
      vrot: 0
    });
    spawnTimer = 0.8;
  }
}

/* ===== Draw Logic (修改這裡以修正變形) ===== */
function drawItems(){
  for(const it of items){
    const isBomb = (it.type === TYPES.BOMB);
    const size = isBomb ? BOMB_DISPLAY_SIZE : (SIZE_MAP[it.type] || 30);
    const r = size/2;
    
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot);

    if(isBomb && bombReady){
      // 針對炸彈：強制繪製為正方形，解決留白導致的變形
      ctx.drawImage(bombImg, -r, -r, size, size);
    } else if (it.type !== TYPES.BOMB && ready) {
       // 原有繪製邏輯
       ctx.drawImage(img, -r, -r, size, size);
    }
    ctx.restore();
  }
}
</script>
</body>
</html>
